# Golden questions for Regulation (EU) 2024/1689 (the AI Act).
#
# `expected_articles` lists the articles that genuinely answer the question. A question is
# satisfied when any one of them is retrieved or cited, because several articles often carry
# parts of the same answer.
#
# Questions marked `answerable: false` are outside the corpus. The correct behaviour is a
# refusal, and a confident answer to one of these is a hallucination.

- id: prohibited-practices
  question: Which AI practices are prohibited?
  expected_articles: ["5"]

- id: penalties
  question: What are the penalties for non-compliance?
  expected_articles: ["99", "100"]

- id: entry-into-force
  question: When does this Regulation enter into force?
  expected_articles: ["113"]

- id: provider-obligations
  question: What obligations do providers of high-risk AI systems have?
  expected_articles: ["16"]

- id: high-risk-classification
  question: How is an AI system classified as high-risk?
  expected_articles: ["6"]

- id: transparency-to-users
  question: Must people be told when they are interacting with an AI system?
  expected_articles: ["50"]

- id: risk-management
  question: What must a risk management system for a high-risk AI system include?
  expected_articles: ["9"]

- id: data-governance
  question: What requirements apply to training data and data governance?
  expected_articles: ["10"]

- id: technical-documentation
  question: What technical documentation must be drawn up for a high-risk AI system?
  expected_articles: ["11"]

- id: human-oversight
  question: What are the requirements for human oversight of high-risk AI systems?
  expected_articles: ["14"]

- id: deployer-obligations
  question: What obligations apply to deployers of high-risk AI systems?
  expected_articles: ["26"]

- id: gpai-obligations
  question: What must providers of general-purpose AI models do?
  expected_articles: ["53"]

- id: systemic-risk
  question: When is a general-purpose AI model considered to pose systemic risk?
  expected_articles: ["51"]

- id: sandboxes
  question: What is an AI regulatory sandbox?
  expected_articles: ["57", "58"]

- id: fundamental-rights-assessment
  question: Who must carry out a fundamental rights impact assessment?
  expected_articles: ["27"]

- id: serious-incidents
  question: How must serious incidents be reported?
  expected_articles: ["73"]

- id: accuracy-cybersecurity
  question: What accuracy, robustness and cybersecurity requirements apply?
  expected_articles: ["15"]

- id: complaints
  question: Can someone lodge a complaint about an AI system?
  expected_articles: ["85"]

- id: right-to-explanation
  question: Do individuals have a right to an explanation of a decision made about them?
  expected_articles: ["86"]

- id: importer-obligations
  question: What obligations do importers of AI systems have?
  expected_articles: ["23"]

- id: ai-literacy
  question: What is AI literacy and who must ensure it?
  expected_articles: ["4"]

- id: logging
  question: What logging and record-keeping is required for high-risk AI systems?
  expected_articles: ["12", "19"]

- id: gpai-fines
  question: What fines can be imposed on providers of general-purpose AI models?
  expected_articles: ["101"]

- id: ce-marking
  question: What does CE marking of a high-risk AI system involve?
  expected_articles: ["48"]

# Out of scope. A grounded answer to any of these is a failure.

- id: oos-capital
  question: What is the capital of France?
  expected_articles: []
  answerable: false

- id: oos-pytorch
  question: How do I train a convolutional neural network in PyTorch?
  expected_articles: []
  answerable: false

- id: oos-football
  question: Who won the 2022 FIFA World Cup?
  expected_articles: []
  answerable: false

- id: oos-recipe
  question: How do I make carbonara sauce?
  expected_articles: []
  answerable: false
