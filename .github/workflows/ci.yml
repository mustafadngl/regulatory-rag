name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/regrag
        run: pytest

  evaluation:
    name: Answer-quality gate
    runs-on: ubuntu-latest
    needs: quality
    # Needs model credentials, so it is skipped on forks and when the secret is absent.
    if: ${{ github.event_name == 'push' }}

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Skip without credentials
        id: guard
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY is not configured; skipping the quality gate."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest the corpus
        if: steps.guard.outputs.run == 'true'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/regrag
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m app.corpus.ingest --recreate

      - name: Evaluate answer quality
        if: steps.guard.outputs.run == 'true'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/regrag
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m app.evaluation.run --output evaluation/report.json

      - name: Publish the report
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/report.json

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t regulatory-rag:ci .

      - name: Verify the container serves health checks
        run: |
          docker run -d --name regrag -p 8000:8000 regulatory-rag:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs regrag
          exit 1
